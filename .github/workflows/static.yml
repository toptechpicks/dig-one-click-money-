name: Deploy static content to Pages

on:
  push:
    branches: ["main"]          # ← change to "master" if your default branch is master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 👇 Optional: list files for debugging (remove after verification)
      - name: List files
        run: ls -la

      # 👇 Configure Pages – essential for the deployment action
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 👇 Upload the *correct* folder containing your static site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # If your site is in the repo root, use "."
          # If it's in a subfolder (e.g., "docs", "dist", "public"), change to that
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
